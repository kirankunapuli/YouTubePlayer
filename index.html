        <h1>YoTP Neo — Watch YouTube Videos Online at Work &amp; School</h1>
        <p>
          YoTP Neo is a free, private YouTube player built for blocked networks.
          If YouTube is blocked at your office, school or corporate workplace,
          enable Proxy Mode and videos stream through YoTP Neo's own server —
          bypassing most firewalls and content filters.
        </p>
        <h2>Features</h2>

          <li>Proxy Mode for restricted office and school networks</li>

          <li>Theater mode, ambient colors, installable as an app (PWA)</li>
        </ul>
        <h2>How it works</h2>
        <p>
          In Direct Mode your browser loads the YouTube embed like normal.
          In Proxy Mode, YoTP Neo's server fetches the video from YouTube and
          re-streams it to you, so your network never sees a connection to
          YouTube itself. Enable Proxy Mode with one click (or press K).
        </p>
